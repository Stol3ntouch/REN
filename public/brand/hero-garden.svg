<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Сад: газон, деревья, солнце и садовая техника">
  <!-- Оригинальная иллюстрация для РемТехСад: только простые фигуры, без фото и чужих изображений. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d3a22"/>
      <stop offset="0.55" stop-color="#2c7a47"/>
      <stop offset="1" stop-color="#8fcf8a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3b0" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#fff3b0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff3b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f9a4f"/>
      <stop offset="1" stop-color="#0f4a26"/>
    </linearGradient>
    <pattern id="stripes" width="120" height="600" patternUnits="userSpaceOnUse" patternTransform="skewX(-18)">
      <rect width="60" height="600" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1600" height="600" fill="url(#sky)"/>
  <circle cx="1240" cy="170" r="210" fill="url(#glow)"/>
  <circle cx="1240" cy="170" r="62" fill="#fff0a8"/>

  <!-- облака -->
  <g fill="#ffffff" fill-opacity="0.16">
    <ellipse cx="760" cy="120" rx="120" ry="26"/>
    <ellipse cx="830" cy="100" rx="80" ry="24"/>
    <ellipse cx="1440" cy="70" rx="110" ry="22"/>
    <ellipse cx="1500" cy="52" rx="70" ry="20"/>
  </g>

  <!-- крупные силуэты гаечного ключа и отвёртки в небе -->
  <g fill="#ffffff" fill-opacity="0.1" transform="translate(900 130) rotate(24)">
    <rect x="-9" y="40" width="18" height="190" rx="9"/>
    <path d="M-22 40 L-22 20 Q-22 -4 0 -4 Q22 -4 22 20 L22 40 Z"/>
    <path d="M-34 -30 L-14 -30 L-14 -6 L14 -6 L14 -30 L34 -30 L34 -2 Q34 20 0 20 Q-34 20 -34 -2 Z" transform="translate(0 -40)"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.1" transform="translate(1000 90) rotate(-24)">
    <rect x="-7" y="60" width="14" height="150" rx="3"/>
    <rect x="-16" y="170" width="32" height="90" rx="14"/>
    <path d="M-3 0 L3 0 L7 60 L-7 60 Z"/>
  </g>

  <!-- дальние холмы -->
  <path d="M0 400 Q200 330 420 380 T860 370 T1280 360 T1600 380 L1600 600 L0 600 Z" fill="#2d7a42"/>
  <path d="M0 440 Q260 390 520 430 T1060 425 T1600 430 L1600 600 L0 600 Z" fill="#24683a"/>

  <!-- деревья -->
  <g>
    <rect x="1128" y="330" width="16" height="110" fill="#17381f"/>
    <circle cx="1136" cy="300" r="64" fill="#1c5a30"/>
    <circle cx="1100" cy="330" r="44" fill="#1f6636"/>
    <circle cx="1176" cy="332" r="46" fill="#1f6636"/>
    <rect x="1430" y="350" width="14" height="95" fill="#17381f"/>
    <circle cx="1437" cy="325" r="52" fill="#1c5a30"/>
    <circle cx="1405" cy="352" r="36" fill="#1f6636"/>
    <circle cx="1470" cy="354" r="38" fill="#1f6636"/>
    <rect x="760" y="372" width="12" height="70" fill="#17381f"/>
    <circle cx="766" cy="352" r="38" fill="#1f6636"/>
    <circle cx="742" cy="374" r="26" fill="#24683a"/>
    <circle cx="792" cy="376" r="26" fill="#24683a"/>
  </g>

  <!-- газон с полосами от стрижки -->
  <path d="M0 470 Q300 430 640 462 T1280 455 T1600 470 L1600 600 L0 600 Z" fill="url(#lawn)"/>
  <path d="M0 470 Q300 430 640 462 T1280 455 T1600 470 L1600 600 L0 600 Z" fill="url(#stripes)"/>

  <!-- газонокосилка (силуэт) -->
  <g transform="translate(1060 470)" fill="#0a2614" fill-opacity="0.92">
    <path d="M0 0 H150 Q170 0 170 20 V40 H-20 V20 Q-20 0 0 0 Z"/>
    <rect x="20" y="-22" width="90" height="26" rx="10"/>
    <path d="M150 -2 L238 -118 L250 -108 L166 6 Z"/>
    <path d="M214 -126 L270 -102 L262 -88 L206 -112 Z"/>
    <circle cx="26" cy="46" r="28"/>
    <circle cx="144" cy="46" r="28"/>
    <circle cx="26" cy="46" r="11" fill="#3f9a4f"/>
    <circle cx="144" cy="46" r="11" fill="#3f9a4f"/>
  </g>

  <!-- триммер (силуэт) -->
  <g transform="translate(700 500) rotate(-24)" fill="#0a2614" fill-opacity="0.9">
    <rect x="0" y="-5" width="300" height="10" rx="5"/>
    <rect x="-40" y="-18" width="60" height="36" rx="12"/>
    <path d="M300 -5 L330 -22 L346 -6 L318 12 Z"/>
    <path d="M338 -14 Q372 -36 392 -8" fill="none" stroke="#0a2614" stroke-width="5" stroke-linecap="round"/>
    <rect x="120" y="-20" width="12" height="22" rx="4"/>
  </g>

  <!-- грабли у края (силуэт) -->
  <g transform="translate(560 480) rotate(14)" fill="#0a2614" fill-opacity="0.85">
    <rect x="-4" y="-150" width="8" height="150" rx="4"/>
    <rect x="-38" y="0" width="76" height="10" rx="3"/>
    <rect x="-36" y="8" width="6" height="26"/>
    <rect x="-22" y="8" width="6" height="26"/>
    <rect x="-8" y="8" width="6" height="26"/>
    <rect x="6" y="8" width="6" height="26"/>
    <rect x="20" y="8" width="6" height="26"/>
    <rect x="32" y="8" width="6" height="26"/>
  </g>

  <!-- травинки и листья переднего плана -->
  <g fill="#0a2614" fill-opacity="0.55">
    <path d="M40 600 Q52 540 70 520 Q64 560 80 600 Z"/>
    <path d="M90 600 Q96 560 120 540 Q112 575 124 600 Z"/>
    <path d="M1480 600 Q1488 548 1510 530 Q1504 566 1520 600 Z"/>
    <path d="M1530 600 Q1540 560 1566 548 Q1556 580 1570 600 Z"/>
    <path d="M360 600 Q372 556 392 540 Q386 572 398 600 Z"/>
  </g>
</svg>
