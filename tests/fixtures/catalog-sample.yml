    <item_description><![CDATA[Бензиновая воздуходувка Champion GBR333 работает в режиме нагнетания воздуха. Подойдет для личного использования на большом участке.<br>Производительность<br>Мощность 0,9 кВт оптимальна для ежедневной уборки свежеопавшей листвы и легкого мусора.<br>Транспортировочная рукоятка<br>Рукоятка делает переноску воздуходувки максимально комфортной. Она не скользит в руке и облегчает частые перемещения по территории.
<br>Легкий запуск двигателя / Easy Engine Start<br>Система облегчённого запуска снижает усилие при запуске на 25%, значительно уменьшает вероятность обратного удара и делает запуск двигателя комфортным и безопасным.<br>Легкий холодный запуск / Easy Cold Start<br>Система Easy cold start обеспечивает легкий запуск холодного двигателя. Достаточно подкачать топливо праймером и зафиксировать курок газа стопором. После этого мотор заводится без усилий даже после длительного перерыва в работе.<br>Безынструментальное соединение труб<br>Позволяет быстро собрать и разобрать инструмент без дополнительных инструментов. Это экономит время при подготовке к работе, упрощает транспортировку и обслуживание.<br>Хромированный цилиндр двигателя<br>Стенки цилиндра имеют специальное хромированное покрытие. Оно снижает трение поршня, уменьшает износ и повышает срок службы двигателя. <br>Ранцевая подвесная система<br>Продуманная система ремней равномерно распределяет вес воздуходувки. Это обеспечивает стабильное и удобное положение устройства во время работы.<br>Эргономичная спинка<br>Спинка воздуходувки выполнена с учётом анатомии человека и оснащена ортопедическими подушечками. Они амортизируют вибрацию и поддерживают спину. В результате снижается нагрузка на позвоночник и повышается комфорт при многочасовой работе.]]></item_description>
