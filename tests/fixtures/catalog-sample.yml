    <item_description><![CDATA[Бензиновая цепная пила Champion 125T-10 благодаря своей компактности и небольшому весу оптимально подходит садоводам и альпинистам для легких работ на высоте.<br>Легкий запуск двигателя / Easy Engine Start<br>В конструкции стартера есть дополнительная пружина, которая снижает необходимое усилие при запуске.<br>Легкий холодный запуск / Easy cold start<br>Праймер и фиксатор курка газа облегчают запуск холодного двигателя. Достаточно подкачать топливо праймером и зафиксировать курок газа стопором. После этого мотор заводится без усилий даже после длительного перерыва в работе.<br>Антивибрационная система / Anti-Vibration System<br>Эффективные антивибрационные элементы в рукоятке уменьшают дискомфорт при работе и способствуют снижению нагрузки на руки и суставы.<br>Боковое натяжение цепи<br>Боковое натяжение цепи позволяет быстро, удобно и безопасно подтянуть пильную цепь.<br>Автоматическая система смазки цепи<br>Продлевает срок службы цепи и снижает расход масла для её смазки, особенно на холостых оборотах.<br>Многоразовый нейлоновый фильтр<br>Воздушный фильтр легко моется и используется многократно. Это особенно важно при работе в пыльных условиях, например, при распиле сухой древесины.<br>Металлический цепеуловитель<br>Перехватывает разорвавшуюся или соскочившую с шины цепь, уменьшая риск получения травм оператором. С ним вы можете работать с полной уверенностью в своей безопасности.<br>Инерционный тормоз цепи<br>Механический инерционный тормоз мгновенно останавливает цепь при отскоке или отдаче, защищая от возможных травм и повышая комфорт работы.<br>Защита от случайного запуска<br>Рычаг блокировки предотвращает непреднамеренное нажатие на рычаг газа и позволяет управлять оборотами двигателя только после разблокировки.<br>Срок службы 10+ лет<br>Долговечность обеспечивается обслуживаемым воздушным фильтром и хромированным цилиндром повышенной надёжности, которые сохраняют работоспособность инструмента на протяжении многих лет.]]></item_description>
