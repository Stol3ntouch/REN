    <item_description><![CDATA[Бензиновый сварочный генератор Champion GW200AE подойдет для использования в качестве резервного источника электроэнергии в частных домах, на даче и при проведении профессиональных работ.<br>Производительность<br>Мощность 4,5 кВА подходит для питания бытовых приборов, электроинструментов или небольшого оборудования. Может обеспечивать работу холодильника, телевизора, освещения и маломощных строительных инструментов.<br>Универсальность<br>Два режима работы: сварочный аппарат или генератор (запрещается подключать потребители в розетки 220В при проведении сварочных работ).<br>Комфортная работа<br>Электрический стартер позволяет без усилий запустить генератор.<br>Надежная конструкция<br>Металлическая рама защищает узлы от механических повреждений.<br>Мобильность<br>В комплекте поставляются транспортировочные колеса, рукоятки и опоры рамы.<br>Простота в обслуживании<br>Индикатор уровня топлива в баке позволяет контролировать расход топлива.<br>Удобство в эксплуатации<br>Блок AVR автоматически стабилизирует напряжение и минимизирует колебания параметров тока. Вольтметр позволяет мониторить напряжение в цепи. Счетчик моточасов позволяет определить состояние устройства и прогнозировать необходимость техобслуживания.]]></item_description>
