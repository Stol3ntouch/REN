    <item_description><![CDATA[Электрическая цепная пила Champion 324N-18 оптимально подходит как для распилки дров диаметром до 30 см, так и для строительных работ.
Это одна из самых мощных электропил в линейке Champion.
<br>Производительность<br>Мощность 2,4 кВт. Такая пила подходит как для распилки дров, так и для малых строительных работ.
<br>Защита от перегрева<br>Система защиты от перегрева автоматически отключает двигатель при критической температуре, предотвращая поломку и продлевая срок службы пилы.
<br>Стабильность при любых нагрузках<br>Металлические шестерни надежно передают вращение от двигателя к пильной гарнитуре, обеспечивая стабильность работы при больших нагрузках.<br>Автоматическая система смазки цепи<br>Масло непрерывно подается на пильную цепь во время работы, что увеличивает срок службы расходных материалов.
<br>Надежная фиксация<br>Металлический зубчатый упор фиксирует агрегат у основания шины относительно бревна и препятствует срыву полотна из пропила, тем самым улучшает контроль над процессом пиления.
<br>Бесключевой механизм натяжения цепи<br>Пильную цепь можно натянуть без специальных инструментов.
<br>Продольное расположение двигателя<br>Делает пилу более маневренной, упрощает работу на высоте и в труднодоступных местах.
<br>Контроль уровня масла<br>Полупрозрачное окошко в корпусе пилы позволяет визуально контролировать уровень масла, что помогает своевременно пополнять его запас и поддерживать оптимальную смазку цепи.
<br>Безопасность<br>Безопасный механический инерционный тормоз мгновенно останавливает цепь при отскоке или отдаче, защищая пользователя от возможных травм и повышая комфорт работы.
<br>Экологичность<br>Электрические пилы не выделяют вредных выхлопов и отличаются низким уровнем шума, что делает их комфортными для работы в закрытых помещениях и жилых зонах.
