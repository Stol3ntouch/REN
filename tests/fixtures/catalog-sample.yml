    <item_description><![CDATA[Воздуходувка-измельчитель Champion GBV326S с функцией нагнетания и пылесоса. Рекомендована для бытового использования на дачном участке.<br>Производительность<br>Мощность 0,75 кВт. Подойдет для уборки свежеопавшей листвы и легкого мусора. Работает в двух режимах: нагнетания и всасывания с функцией измельчения листьев.<br>Транспортировочная рукоятка<br>Рукоятка делает переноску воздуходувки максимально комфортной. Она не скользит в руке и облегчает частые перемещения по территории.
<br>Легкий холодный запуск / Easy Cold Start<br>Система Easy cold start обеспечивает легкий запуск холодного двигателя. Достаточно подкачать топливо праймером и зафиксировать курок газа стопором. После этого мотор заводится без усилий даже после длительного перерыва в работе.<br>Безынструментальное соединение труб<br>Позволяет быстро собрать и разобрать инструмент без дополнительных инструментов. Это экономит время при подготовке к работе, упрощает транспортировку и обслуживание.<br>Хромированный цилиндр двигателя<br>Стенки цилиндра имеют специальное хромированное покрытие. Оно снижает трение поршня, уменьшает износ и повышает срок службы двигателя.<br>Функция измельчения<br>Работает за счёт металлического ножа на крыльчатке: он сразу режет листву и мелкий мусор, поэтому в мешок попадает уже измельчённый материал — так мешок заполняется заметно медленнее. Работать в этом режиме можно только на чистой территории без камней, стекла и другого твёрдого мусора, иначе нож и крыльчатка быстро повредятся. <br>Объемный мешок<br>Воздуходувка оснащена вместительным мешком для сбора мусора объёмом 50 литров.]]></item_description>
