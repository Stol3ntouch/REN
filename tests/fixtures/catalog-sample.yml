    <item_description><![CDATA[Champion 240-16 – компактная и простая в эксплуатации пила, подходящая для большинства видов работ на участке загородного дома.<br>Легкий запуск двигателя / Easy Engine Start<br>В конструкции стартера есть дополнительная пружина, которая снижает необходимое усилие при запуске.<br>Легкий холодный запуск / Easy cold start<br>Праймер и фиксатор курка газа облегчают запуск холодного двигателя. Достаточно подкачать топливо праймером и зафиксировать курок газа стопором. После этого мотор заводится без усилий даже после длительного перерыва в работе.<br>Антивибрационная система / Anti-Vibration System<br>Эффективные антивибрационные элементы в рукоятке уменьшают дискомфорт при работе и способствуют снижению нагрузки на руки и суставы.<br>Боковое натяжение цепи<br>Боковое натяжение цепи позволяет быстро, удобно и безопасно подтянуть пильную цепь.<br>Автоматическая система смазки цепи<br>Продлевает срок службы цепи и снижает расход масла для её смазки, особенно на холостых оборотах.<br>Воздушный фильтр с легким доступом<br>Бумажно-воздушный фильтр усиленной конструкции надёжно удерживает мелкодисперсную пыль, продлевая ресурс двигателя. А благодаря удобному безинструментальному доступу замена фильтра занимает всего несколько секунд.<br>Металлический цепеуловитель<br>Перехватывает разорвавшуюся или соскочившую с шины цепь, уменьшая риск получения травм оператором. С ним вы можете работать с полной уверенностью в своей безопасности. <br>Инерционный тормоз цепи<br>Механический инерционный тормоз мгновенно останавливает цепь при отскоке или отдаче, защищая от возможных травм и повышая комфорт работы.<br>Защита от случайного запуска<br>Рычаг блокировки предотвращает непреднамеренное нажатие на рычаг газа и позволяет управлять оборотами двигателя только после разблокировки.<br>Срок службы 10+ лет<br>Долговечность обеспечивается обслуживаемым воздушным фильтром и хромированным цилиндром повышенной надёжности, которые сохраняют работоспособность инструмента на протяжении многих лет.<br>Щиток задней рукоятки<br>Расширение нижней части задней ручки бензопилы для защиты руки от цепи в случае разрыва цепи или ее соскока с направляющей шины.]]></item_description>
