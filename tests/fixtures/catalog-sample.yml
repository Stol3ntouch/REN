ечность и прочность газонокосилки даже при интенсивной эксплуатации.<br>Срок службы: 10+ лет<br>Благодаря чугунной гильзе цилиндр не деформируется при перегревах, что исключает прорыв газов, сохраняет компрессию и мощность, а значит, техника служит в разы дольше без капремонта.<br>Комфорт в работе<br>Привод на задние колёса облегчает управление, поэтому оператору не требуется прилагать усилий для её толкания, что экономит его силы и ускоряет процесс кошения. 


