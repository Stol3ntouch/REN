    <item_description><![CDATA[Бензиновая газонокосилка Champion LM4215 рекомендована для бытового использования. Отлично подойдет для небольших участков до 5-6 соток с ровным рельефом, для ухода за аккуратным газонов возле дома или дачи<br>Производительность<br>4х-тактный двигатель мощностью 2 л.с. делает эту модель оптимальным вариантом для небольших участков с ровным рельефом.<br>Удобство в эксплуатации<br>Это достаточно легкая газонокосилка весом всего 20,7 кг, за счет чего она проста в управлении и более маневренная по сравнению с другими моделями.<br>Быстрая обработка трека<br>Имеет ширину скашивания 420 мм, что оптимально для дачного участка небольшой площади в 5-6 соток.<br>Точная настройка под любые задачи<br>Высота скашивания удобно регулируется одним рычагом. Предусмотрено 5 положений высоты, что позволяет выбрать оптимальную высоту травы в зависимости от назначения газона.<br>Легкое обслуживание воздушного фильтра<br>Воздушный фильтр Champion легко обслуживать: крышка снимается руками, без использования инструментов. При этом поролоновый воздушный  фильтр с объемной фильтрацией можно мыть и использовать повторно, обеспечивая высокую пылеёмкость и многоразовость.<br>Легкий запуск / Easy start<br>Праймер облегчает запуск холодного двигателя, так как устройство принудительно подает дополнительный бензин для обогащения топливной смеси.<br>Комфорт в управлении<br>Прорезиненное покрытие на рукоятках обеспечивает надежный хват и комфортную работу пользователя.<br>Легкое обслуживание деки<br>Легкая очистка деки: достаточно подключить садовый шланг к быстросъемному коннектору штуцера и запустить двигатель. Вода под давлением попадает внутрь, а вращающийся нож создает турбулентный поток, который мгновенно смывает все остатки травы.<br>Профессиональный подход: дека из прочной стали<br>Стальная дека обеспечивает жесткость и ударопрочность конструкции, что продлевает срок службы газонокосилки в разы.<br>Беспрерывная работа<br>Большой травосборник объемом 40 литров позволяет реже прерывать работу для его очистки. Он легко снимается и устанавливается.<br>Эргономичность<br>Складные рукоятки упрощают хранение и транспортировку агрегата.<br>Срок службы: 10+ лет<br>Благодаря чугунной гильзе цилиндр не деформируется при перегревах, что исключает прорыв газов, сохраняет компрессию и мощность, а значит, техника служит в разы дольше без капремонта.]]></item_description>
