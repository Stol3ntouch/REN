    <item_description><![CDATA[Электрическая цепная пила Champion 118-14 предназначена для бытового использования: на даче, на участке загородного дома, для заготовки дров и спила небольших деревьев.<br>Производительность<br>Мощность 1,8 кВт. Подойдет для валки тонких деревьев, обрезки сучьев, распила бревен небольшого диаметра (до 20 см), заготовки дров и других бытовых работ по дереву.<br>Автоматическая система смазки цепи<br>Масло непрерывно подается на пильную цепь во время работы, что увеличивает срок службы расходных материалов.<br>Контроль уровня масла<br>Полупрозрачное окошко в корпусе пилы позволяет визуально контролировать уровень масла, что помогает своевременно пополнять его запас и поддерживать оптимальную смазку цепи.
<br>Легкая модель<br>Малые весовые габариты пилы обеспечивают удобство при транспортировке и работе, снижая утомляемость пользователя.<br>Безопасность<br>Безопасный механический инерционный тормоз мгновенно останавливает цепь при отскоке или отдаче, защищая пользователя от возможных травм и повышая комфорт работы.<br>Экологичность<br>Электрические пилы не выделяют вредных выхлопов и отличаются низким уровнем шума, что делает их комфортными для работы в закрытых помещениях и жилых зонах.]]></item_description>
